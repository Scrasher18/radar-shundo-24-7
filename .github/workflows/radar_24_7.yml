name: Radar Shundo & PvP 24/7 (Cloud)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-shundo-singleton
  cancel-in-progress: false

jobs:
  radar-24-7:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repositorio (siempre última versión de main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Radar Shundo + PvP GL/UL + Eventos en bucle (escaneo cada 7 minutos)
        env:
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          JWT_TOKEN_2: ${{ secrets.JWT_TOKEN_2 }}
          JWT_TOKEN_3: ${{ secrets.JWT_TOKEN_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_GL: ${{ secrets.DISCORD_WEBHOOK_GL }}
          DISCORD_WEBHOOK_UL: ${{ secrets.DISCORD_WEBHOOK_UL }}
          DISCORD_WEBHOOK_EVENTO: ${{ secrets.DISCORD_WEBHOOK_EVENTO }}
          DISCORD_EVENTO_CHANNEL_ID: ${{ secrets.DISCORD_EVENTO_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID_MENCION: "924392800534011935"
          CLOUD_MODE: "1"
        run: |
          git config user.name "radar-shundo-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python radar.py --duracion-minutos 40

      - name: Guardar historial de notificados y cache
        if: ${{ !cancelled() }}
        run: |
          git fetch origin main || true
          git reset --mixed origin/main || true
          git add shundos_notificados.json cache_coordenadas.json evento_config.json || true
          git diff --staged --quiet || (git commit -m "chore: actualizar cache shundos y pvp [skip ci]" && git push origin main) || true

      - name: Auto-encadenar siguiente ciclo 24/7
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run radar_24_7.yml || true
